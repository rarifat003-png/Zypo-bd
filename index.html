/* ============ STATE ============ */
var LANG='bn', allProducts=[], filtered=[], curCat='all', cart=[], slugMap={}, hasDates=false, loaded=false, loadFailed=false;
var pdp={product:null,color:'',size:'',qty:1,imgIdx:0}, lastOrderAt=0, searchTimer=null, slideIdx=0, slideTimer=null;

function t(k){ return (T[LANG]&&T[LANG][k]!=null)?T[LANG][k]:(T.bn[k]!=null?T.bn[k]:k); }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function n2(n){ return Number(n||0).toLocaleString('en-US'); }
function money(n){ return '৳'+n2(n); }
function toast(m){ var x=el('toast'); if(!x)return; x.textContent=m; x.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){x.classList.remove('show');},2600); }
function pkey(p){ return String(p.id!=null?p.id:(p.slug||p.name||'')); }
function slugify(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function ovr(map,p){ return (p.id!=null&&map[p.id])||(p.slug&&map[p.slug])||0; }
function getList(d){
  if(Array.isArray(d))return d; if(!d||typeof d!=='object')return [];
  var l=d.products||d.items||d.data||(d.data&&(d.data.products||d.data.items)); if(Array.isArray(l))return l;
  for(var k in d){ if(Array.isArray(d[k])&&d[k].length&&typeof d[k][0]==='object')return d[k]; } return [];
}

/* ============ PRICE ============ */
function getPriceInfo(p){
  var sell=Number(ovr(CUSTOM_SELLING_PRICES,p)||p.sellingPrice||p.suggestedPrice||p.price||p.minimumSellingPrice||0)||0;
  var offer=Number(ovr(CUSTOM_OFFER_PRICES,p)||0)||0;
  var reg=Number(ovr(CUSTOM_REGULAR_PRICES,p)||p.regularPrice||p.suggestedPriceMax||p.mrp||p.compareAtPrice||0)||0;
  var eff=(offer>0&&(sell<=0||offer<sell))?offer:sell;
  var strike=(reg>eff)?reg:((offer>0&&sell>offer)?sell:0);
  var pct=(eff>0&&strike>eff)?Math.round((strike-eff)/strike*100):0;
  return {selling:eff,regular:pct>0?strike:0,priced:eff>0,hasDiscount:pct>0,discountAmount:pct>0?strike-eff:0,discountPercent:pct};
}
function priceHtml(i,big){
  if(!i.priced)return '<span class="rp" style="text-decoration:none">'+t('price_na')+'</span>';
  return '<span class="sp"'+(big?' style="font-size:26px"':'')+'><span class="cur">৳</span>'+n2(i.selling)+'</span>'+
    (i.hasDiscount?'<span class="rp"'+(big?' style="font-size:16px"':'')+'>'+money(i.regular)+'</span><span class="off">'+i.discountPercent+'% OFF</span>':'');
}

/* ============ STOCK / IMAGES ============ */
function getImages(p){ var a=[]; if(p.image)a.push(p.image); if(Array.isArray(p.images))p.images.forEach(function(u){ if(u&&a.indexOf(u)===-1)a.push(u); }); return a; }
function hasSI(o){ return typeof o.inStock==='boolean'||typeof o.stockQuantity==='number'; }
function vOk(v){ if(v.inStock===false)return false; if(typeof v.stockQuantity==='number'&&v.stockQuantity<=0)return false; return true; }
function variants(p){ return Array.isArray(p.variants)?p.variants:[]; }
function matchV(p,c,s){ return variants(p).filter(function(v){ return (!c||(v.color||'')===c)&&(!s||(v.size||'')===s); }); }
// returns 'out' | 'in' | 'unknown'
function stockState(p,c,s){
  if(p.inStock===false)return 'out';
  if(typeof p.stockQuantity==='number'&&p.stockQuantity<=0)return 'out';
  var vs=variants(p);
  if(vs.length){
    if(c||s){ var m=matchV(p,c,s); if(m.length&&!m.some(vOk))return 'out'; }
    else if(vs.some(hasSI)&&!vs.some(vOk))return 'out';
  }
  if(hasSI(p)||vs.some(hasSI))return 'in';
  return 'unknown';
}
function isOut(p,c,s){ return stockState(p,c,s)==='out'; }
function canBuy(p,c,s){ var st=stockState(p,c,s); return st!=='out'&&getPriceInfo(p).priced&&(st==='in'||STOCK_UNKNOWN_AS_AVAILABLE); }
function maxQty(p,c,s){ var m=matchV(p,c,s)[0],cap=99; if(m&&typeof m.stockQuantity==='number')cap=Math.min(cap,m.stockQuantity); else if(typeof p.stockQuantity==='number')cap=Math.min(cap,p.stockQuantity); return Math.max(cap,1); }
function vLists(p){ var c=[],s=[]; variants(p).forEach(function(v){ if(v.color&&c.indexOf(v.color)===-1)c.push(v.color); if(v.size&&s.indexOf(v.size)===-1)s.push(v.size); }); return {colors:c,sizes:s}; }
function firstAvail(p){ var v=variants(p); return v.find(vOk)||v[0]||null; }

}
function applyStatic(){

    (buy?'<button type="button" id="wa-direct" class="wab" onclick="waDirect(this)">'+t('wa_full')+'</button>':'<div class="wab dis">'+t('order_closed')+'</div>')+
    '<div class="desc" style="margin-top:18px;padding-top:16px;border-top:1px solid var(--bd);font-size:13px;color:#404040;line-height:1.7">'+(desc?'<strong style="display:block;margin-bottom:8px;color:var(--dark)">'+t('desc')+'</strong>'+desc:'')+featHtml(p)+'</div></div></div>';
  productMeta(p);
}
function renderRelated(p){
  var r=allProducts.filter(function(x){ return x!==p&&p.category&&x.category===p.category; }); r.sort(function(a,b){ return (isOut(a)?1:0)-(isOut(b)?1:0); });
  row('rel-sec','rel-grid',r,4);
}

/* ============ CART ============ */
function loadCart(){
  try{ var r=JSON.parse(localStorage.getItem(CART_KEY)||'[]'); if(!Array.isArray(r))return [];
    return r.filter(function(x){ return x&&typeof x.name==='string'&&Number(x.price)>0&&Number(x.qty)>=1; }).map(function(x){ return {key:String(x.key),pid:String(x.pid||''),name:x.name,img:x.img||'',color:x.color||'',size:x.size||'',price:Number(x.price),qty:Math.min(Math.floor(Number(x.qty)),99)}; });
  }catch(e){ return []; }
}
function saveCart(){ try{ localStorage.setItem(CART_KEY,JSON.stringify(cart)); }catch(e){} }
function findP(list,it){ return list.find(function(p){ return it.pid&&pkey(p)===it.pid; })||list.find(function(p){ return p.name===it.name; })||null; }
function applyFresh(list){
  cart.forEach(function(x){ var p=findP(list,x); if(!p){ x.unavailable=true; return; } var i=getPriceInfo(p); if(i.priced)x.price=i.selling; x.unavailable=!i.priced||isOut(p,x.color,x.size)||(stockState(p,x.color,x.size)==='unknown'&&!STOCK_UNKNOWN_AS_AVAILABLE); });
}
function refreshCart(){ applyFresh(allProducts); saveCart(); updateCart(); }
function pushToCart(p,qty,c,s){
  var i=getPriceInfo(p); if(!i.priced)return toast(t('t_noprice')); if(!canBuy(p,c,s))return toast(t('t_oos'));
  var im=getImages(p), key=pkey(p)+'|'+(c||'')+'|'+(s||''), f=cart.find(function(x){ return x.key===key; }), mx=maxQty(p,c,s);
  if(f){ f.qty=Math.min(f.qty+qty,mx); f.price=i.selling; f.unavailable=false; } else cart.push({key:key,pid:pkey(p),name:p.name,img:im[0]||'',color:c||'',size:s||'',price:i.selling,qty:Math.min(qty,mx)});
  saveCart(); updateCart(); if(!el('drawer').classList.contains('open'))toggleCart();
}
function addFromPDP(){ var p=pdp.product; if(p)pushToCart(p,pdp.qty,pdp.color,pdp.size); }
function quickAdd(gi){ var p=allProducts[gi]; if(!p)return; var v=firstAvail(p); pushToCart(p,1,v?(v.color||''):'',v?(v.size||''):''); }
function chQty(i,d){ var x=cart[i]; if(!x)return; x.qty=Math.min(x.qty+d,99); if(x.qty<=0)cart.splice(i,1); saveCart(); updateCart(); }
function rmItem(i){ cart.splice(i,1); saveCart(); updateCart(); }
function delCharge(){ if(!SHOW_DELIVERY_CHARGE)return null; var d=el('cdist').value; if(!d)return null; return d==='Dhaka'?DELIVERY_DHAKA:DELIVERY_OUTSIDE; }
function updateCart(){
  var cnt=0,sub=0; cart.forEach(function(x){ cnt+=x.qty; sub+=x.price*x.qty; });
  el('c-count').textContent=cnt; el('c-sub').textContent=money(sub);
  var dc=delCharge();
  el('c-del').textContent=SHOW_DELIVERY_CHARGE?(dc===null?t('pick_dist'):money(dc)):t('delivery_sep');
  el('c-tot').textContent=money(sub+(dc||0));
  var box=el('c-items'); if(!cart.length){ box.innerHTML='<p style="text-align:center;color:#9CA3AF;padding:24px">'+t('empty')+'</p>'; return; }
  box.innerHTML=cart.map(function(x,i){ var meta=[x.color,x.size].filter(Boolean).join(' / ');
    return '<div class="ci'+(x.unavailable?' bad':'')+'">'+(x.img&&!x.unavailable?'<img src="'+esc(x.img)+'" class="cth" alt="'+esc(x.name||'')+'" loading="lazy">':'<div class="cth"></div>')+
    '<div style="flex:1;min-width:0"><strong style="word-break:break-word">'+esc(x.name)+'</strong>'+(meta?'<div style="font-size:11px;color:#525252">'+esc(meta)+'</div>':'')+
    (x.unavailable?'<div style="font-size:11px;color:var(--red);font-weight:800">'+t('oos_cart')+'</div>':'')+
    '<small>'+money(x.price)+' × '+x.qty+' = '+money(x.price*x.qty)+'</small><br><button type="button" class="rm" onclick="rmItem('+i+')">'+t('remove')+'</button></div>'+
    '<div style="display:flex;gap:6px;align-items:center"><button type="button" class="qb" onclick="chQty('+i+',-1)" aria-label="-">-</button><span>'+x.qty+'</span><button type="button" class="qb" onclick="chQty('+i+',1)" aria-label="+">+</button></div></div>'; }).join('');
}
function toggleCart(){ var d=el('drawer'); d.classList.toggle('open'); document.body.style.overflow=d.classList.contains('open')?'hidden':''; if(d.classList.contains('open')&&loaded)refreshCart(); }
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&el('drawer').classList.contains('open'))toggleCart(); });

/* ============ CHECKOUT / WHATSAPP ============ */
function normPhone(s){ var d=String(s||'').replace(/[\s\-()]/g,''); if(d.indexOf('+880')===0)d='0'+d.slice(4); else if(d.indexOf('880')===0)d='0'+d.slice(3); return d; }
function validPhone(d){ return /^01[3-9]\d{8}$/.test(d); }
function setMsg(m,k){ var x=el('c-msg'); x.className='msg'+(k?' '+k:''); x.textContent=m||''; }
function markBad(ids){ ['cname','cphone','cdist','caddr'].forEach(function(i){ el(i).classList.toggle('bad',ids.indexOf(i)!==-1); }); }
function openWa(w,msg){ var u='https://wa.me/'+WA_NUM+'?text='+encodeURIComponent(msg); if(w&&!w.closed)w.location.href=u; else window.location.href=u; }
function variantTxt(c,s){ return [c?'Color: '+c:'',s?'Size: '+s:''].filter(Boolean).join(', '); }

function orderWA(){
  setMsg(''); if(el('cweb').value)return; if(!cart.length)return setMsg(t('e_empty'),'err');
  var n=el('cname').value.trim(), ph=normPhone(el('cphone').value), d=el('cdist').value, a=el('caddr').value.trim(), note=el('cnote').value.trim().slice(0,300), bad=[];
  if(n.length<2)bad.push('cname'); if(!validPhone(ph))bad.push('cphone'); if(SHOW_DELIVERY_CHARGE&&!d)bad.push('cdist'); if(a.length<6)bad.push('caddr');
  markBad(bad); if(bad.length)return setMsg(bad.length===1&&bad[0]==='cphone'?t('e_phone'):t('e_fields'),'err');
  if(Date.now()-lastOrderAt<4000)return; lastOrderAt=Date.now();
  var w=window.open('','_blank'), btn=el('wa-submit'); btn.disabled=true; setMsg(t('e_check'));
  fetchProducts().then(function(fresh){
    applyFresh(fresh); saveCart(); updateCart();
    var bads=cart.filter(function(x){ return x.unavailable; });
    if(bads.length){ if(w)w.close(); return setMsg(t('e_out')+bads.map(function(x){ return x.name; }).join(', ')+t('e_out2'),'err'); }
    var sub=0, dc=SHOW_DELIVERY_CHARGE?(d==='Dhaka'?DELIVERY_DHAKA:DELIVERY_OUTSIDE):null;
    var lines=cart.map(function(x,i){ sub+=x.price*x.qty; var v=variantTxt(x.color,x.size); return (i+1)+'. '+x.name+(x.pid?' [ID: '+x.pid+']':'')+(v?'\n   '+v:'')+'\n   '+t('w_unit')+': '+money(x.price)+' × '+x.qty+' = '+money(x.price*x.qty); }).join('\n');
    var msg=t('w_hello')+'\n\n'+t('w_name')+': '+n+'\n'+t('w_phone')+': '+ph+'\n'+t('w_addr')+': '+a+(d&&SHOW_DELIVERY_CHARGE?', '+d:'')+'\n'+(note?t('w_note')+': '+note+'\n':'')+
      '\n'+t('w_items')+':\n'+lines+'\n\n'+t('w_sub')+': '+money(sub)+'\n'+t('w_del')+': '+(dc!==null?money(dc):t('delivery_sep'))+'\n'+t('w_total')+': '+money(sub+(dc||0))+'\n\n'+t('w_stock');
    openWa(w,msg); setMsg(t('e_opened'),'ok');
  }).catch(function(){ if(w)w.close(); setMsg(t('e_verify'),'err'); }).then(function(){ btn.disabled=false; });
}
// One product on WhatsApp (re-checks stock first)
function waOne(p,c,s,q,btn){
  var w=window.open('',(btn?'_blank':'_blank')); if(btn)btn.disabled=true;
  fetchProducts().then(function(fresh){
    var fp=findP(fresh,{pid:pkey(p),name:p.name}), i=fp?getPriceInfo(fp):null;
    if(!fp||!i.priced||isOut(fp,c,s)||(stockState(fp,c,s)==='unknown'&&!STOCK_UNKNOWN_AS_AVAILABLE)){ if(w)w.close(); toast(t('t_oos2')); return; }
    var v=variantTxt(c,s);
    var msg=t('w_one')+'\n• '+p.name+(p.id!=null?' [ID: '+p.id+']':'')+(v?'\n• '+v:'')+'\n• '+t('w_qty')+': '+q+'\n• '+t('w_unit')+': '+money(i.selling)+'\n• '+t('w_price')+': '+money(i.selling*q)+'\n• '+deliveryText()+'\n'+t('w_stock');
    openWa(w,msg);
  }).catch(function(){ if(w)w.close(); toast(t('e_verify')); }).then(function(){ if(btn)btn.disabled=false; });
}
function waDirect(btn){ var p=pdp.product; if(p)waOne(p,pdp.color,pdp.size,pdp.qty,btn); }
function quickWA(gi,btn){ var p=allProducts[gi]; if(!p)return; var v=firstAvail(p); waOne(p,v?(v.color||''):'',v?(v.size||''):'',1,btn); }

function renderSocial(){
  var items=[['Facebook',FACEBOOK_URL,ICON.fb],['TikTok',TIKTOK_URL,ICON.tt],['WhatsApp','https://wa.me/'+WA_NUM,ICON.wa]].filter(function(i){ return /^https:\/\//i.test(i[1]); });
  var h=items.map(function(i){ return '<a href="'+esc(i[1])+'" target="_blank" rel="noopener noreferrer" aria-label="Zypo '+i[0]+'">'+i[2]+'<span>'+i[0]+'</span></a>'; }).join('');
  document.querySelectorAll('[data-social]').forEach(function(n){ n.innerHTML=h; });

}

/* ============ INIT ============ */
(function init(){
  try{ var l=localStorage.getItem(LANG_KEY); if(l==='en'||l==='bn')LANG=l; }catch(e){}
  var sel=el('cdist'); DISTRICTS.forEach(function(x){ var o=document.createElement('option'); o.value=x; o.textContent=x; sel.appendChild(o); });
  applyStatic(); renderSlider(); renderSocial(); cart=loadCart(); updateCart(); route(); loadProducts();
})();
</script>
<script>
(function(){
  var hd=document.querySelector('header');
  function setH(){ try{ document.documentElement.style.setProperty('--hh',hd.offsetHeight+'px'); }catch(e){} }
  setH(); addEventListener('resize',setH); addEventListener('load',setH);
  if(window.ResizeObserver)new ResizeObserver(setH).observe(hd);
  /* swipe on product grid changes category (mobile) */
  var g=document.getElementById('grid'),sx=0,sy=0,ok=false;
  if(g){
    g.addEventListener('touchstart',function(e){ var t=e.touches[0]; sx=t.clientX; sy=t.clientY; ok=e.touches.length===1; },{passive:true});
    g.addEventListener('touchend',function(e){
      if(!ok)return; ok=false; var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
      if(Math.abs(dx)<80||Math.abs(dy)>45||Math.abs(dx)<Math.abs(dy)*2)return;
      var cs=[].slice.call(document.querySelectorAll('#chips .chip')), i=cs.findIndex(function(c){ return c.classList.contains('on'); });
      if(i<0)return; var n=dx<0?i+1:i-1; if(n>=0&&n<cs.length)cs[n].click();
    },{passive:true});
  }
  /* WhatsApp tooltip hint once */
  var f=document.getElementById('fab');
  try{ if(f&&!sessionStorage.getItem('zypo_tip')){ setTimeout(function(){ f.classList.add('tip'); setTimeout(function(){ f.classList.remove('tip'); },4500); },2500); sessionStorage.setItem('zypo_tip','1'); } }catch(e){}
})();
</script>
